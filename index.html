<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Galerie 3D - Pluie & Nettoyage</title>
    <style>
        /* Harmonisation globale : arrière-plan clair et police moderne */
        body { margin: 0; overflow: hidden; background: #eeeeee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Menu #ui épuré style Pro */
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.95); border-radius: 12px;
            padding: 20px; font-size: 14px; z-index: 1000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15); border: 1px solid #ddd;
            width: 260px;
        }
        
        /* Bandeau d'indications en bas */
        #hint {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.6); color: white;
            padding: 8px 15px; border-radius: 8px; font-size: 12px;
            pointer-events: none; z-index: 5;
        }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            border: 2px solid white; border-radius: 50%;
            pointer-events: none; mix-blend-mode: difference;
        }
        
        /* Touches clavier stylisées */
        kbd { background: #eee; border-radius: 3px; padding: 2px 4px; border: 1px solid #ccc; font-weight: bold; color: #333; }
        
        /* Séparateurs discrets */
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }

        /* Structure des groupes de boutons */
        .btn-group { margin-top: 15px; display: flex; gap: 8px; flex-direction: column; }

        /* Style de bouton de base à plat */
        button { 
            padding: 10px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; 
            background: white; transition: 0.2s; font-size: 12px; text-align: left;
            display: flex; justify-content: space-between; align-items: center;
        }
        button:hover { background: #f8f8f8; border-color: #999; }
        
        /* Bouton bleu primaire (Charger le dossier) */
        .btn-primary { background: #e3f2fd; border-color: #2196f3; font-weight: bold; color: #0d47a1; }
        .btn-primary:hover { background: #bbdefb; }

        /* Bouton rouge (Réinitialiser) */
        .btn-danger { color: #d32f2f; border-color: #ffcdd2; background: white; }
        .btn-danger:hover { background: #ffebee; border-color: #d32f2f; }
        
        /* --- BOUTON DE NAVIGATION HARMONISÉ --- */
        .btn-nav {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #1b5e20;
            font-weight: bold;
            text-decoration: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 6px;
            border: 1px solid #4caf50;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .btn-nav:hover { background: #c8e6c9; }
    </style>
</head>
<body>

<div id="hint">
    <kbd>0</kbd> Menu | <kbd>1</kbd> Pluie | <kbd>2</kbd> Stop + Nettoyer
</div>

<div id="ui" onmousedown="event.stopPropagation()">
    <div class="btn-group">
        <button class="btn-primary" id="btnLoad" onclick="loadFolder()">
            <span> Charger mon dossier</span>
        </button>
    </div>
    <p id="imgCount" style="font-size: 11px; margin: 8px 0 0 0; color: #666; text-align:center;">0 images chargées</p>
    
    <hr>
    
    <strong> Mode Pluie : <span id="rainStatus" style="color:#d32f2f">OFF</span></strong><br>
    <small style="color: #555;">Appuyez sur <kbd>1</kbd> pour lancer</small><br>
    <small style="color: #555;">Appuyez sur <kbd>2</kbd> pour <b>tout stopper</b></small>
    
    <hr>
    
    <strong> Contrôles :</strong><br>
    <span style="display:inline-block; margin-top:5px;">
        <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> : Marcher
    </span><br>
    <span style="display:inline-block; margin-top:5px;">
        <kbd>E</kbd> : Mur fixe | <kbd>X</kbd> : Supprimer viser
    </span>
    
    <hr>
    
    <div class="btn-group">
        <button class="btn-danger" onclick="clearScene()">
            <span>Réinitialiser</span>
        </button>
        
      
    </div>
</div>

<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
    let isLocked = false, artworks = [], fallingObjects = [], imageLibrary = [], uiVisible = true;
    let isRainActive = false, rainInterval = null, rainIndex = 0;
    const keys = { z: false, q: false, s: false, d: false };

    // --- SCÈNE ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);
    scene.fog = new THREE.Fog(0xf0f0f0, 5, 45);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 5);
    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 0.5);
    sun.position.set(5, 15, 7.5);
    scene.add(sun);

    scene.add(new THREE.GridHelper(200, 100, 0xcccccc, 0xdddddd));
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshBasicMaterial({ visible: false }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const raycaster = new THREE.Raycaster();
    const center = new THREE.Vector2(0, 0);

    // --- CHARGEMENT ---
    function loadFolder() {
        const input = document.createElement('input');
        input.type = 'file';
        input.webkitdirectory = true; 
        input.onchange = e => {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            imageLibrary = [];
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = ev => {
                    imageLibrary.push(ev.target.result);
                    document.getElementById('imgCount').innerText = `${imageLibrary.length} images chargées`;
                };
                reader.readAsDataURL(file);
            });
        };
        input.click();
    }

    // --- SYSTÈME DE PLUIE ---
    function toggleRain() {
        if (imageLibrary.length === 0) return alert("Chargez des images d'abord !");
        isRainActive = !isRainActive;
        updateRainUI();
        if (isRainActive) {
            rainInterval = setInterval(spawnRainDrop, 300);
        } else {
            clearInterval(rainInterval);
        }
    }

    function stopAndClearRain() {
        isRainActive = false;
        clearInterval(rainInterval);
        updateRainUI();

        fallingObjects.forEach(obj => {
            scene.remove(obj.mesh);
            artworks = artworks.filter(a => a !== obj.mesh);
        });
        fallingObjects = [];
        saveToLocal();
    }

    function updateRainUI() {
        const status = document.getElementById('rainStatus');
        status.innerText = isRainActive ? "ON" : "OFF";
        status.style.color = isRainActive ? "#2e7d32" : "#d32f2f";
    }

    function spawnRainDrop() {
        if (rainIndex >= imageLibrary.length) rainIndex = 0;
        const angle = Math.random() * Math.PI * 2;
        const dist = 3 + Math.random() * 10;
        const posX = camera.position.x + Math.cos(angle) * dist;
        const posZ = camera.position.z + Math.sin(angle) * dist;

        const img = imageLibrary[rainIndex];
        const mesh = createObject({x: posX, y: 15, z: posZ}, Math.random() * Math.PI, {x:0.5, y:0.5, z:1}, img);
        
        fallingObjects.push({ 
            mesh: mesh, 
            targetY: 0.6
        });
        rainIndex++;
    }

    // --- CRÉATION ---
    function createObject(pos, rot, scale, imageUrl = null) {
        const geometry = new THREE.BoxGeometry(2, 2, 0.1);
        let material = Array(6).fill().map(() => new THREE.MeshLambertMaterial({ color: 0xffffff }));
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(pos.x, pos.y, pos.z);
        mesh.rotation.y = rot;

        if (imageUrl) {
            new THREE.TextureLoader().load(imageUrl, tex => {
                const ratio = tex.image.width / tex.image.height;
                mesh.scale.set(ratio * scale.x, 1 * scale.y, 1);
                const imgMat = new THREE.MeshBasicMaterial({ map: tex });
                mesh.material[4] = imgMat; mesh.material[5] = imgMat;
            });
        }
        scene.add(mesh);
        artworks.push(mesh);
        saveToLocal();
        return mesh;
    }

    function saveToLocal() {
        const data = artworks.map(a => ({
            pos: a.position,
            rot: a.rotation.y,
            scale: {x: a.scale.x, y: a.scale.y}
        }));
        localStorage.setItem('galerie_data', JSON.stringify(data));
    }

    // --- INPUTS ---
    document.addEventListener("keydown", e => {
        const key = e.key.toLowerCase();
        if (key === "0") { uiVisible = !uiVisible; document.getElementById('ui').style.display = uiVisible ? 'block' : 'none'; }
        if (key === "1") toggleRain();
        if (key === "2") stopAndClearRain();
        if (keys.hasOwnProperty(key)) keys[key] = true;
        
        if (isLocked) {
            if (key === "e") placeWall();
            if (key === "x") deleteTarget();
        }
    });

    document.addEventListener("keyup", e => {
        if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
    });

    function deleteTarget() {
        raycaster.setFromCamera(center, camera);
        const intersects = raycaster.intersectObjects(artworks);
        if (intersects.length > 0) {
            const target = intersects[0].object;
            scene.remove(target);
            artworks = artworks.filter(a => a !== target);
            fallingObjects = fallingObjects.filter(o => o.mesh !== target);
            saveToLocal();
        }
    }

    document.addEventListener("mousedown", (e) => {
        if (e.target.closest('#ui')) return;
        if (!isLocked) document.body.requestPointerLock();
    });

    document.addEventListener("pointerlockchange", () => isLocked = document.pointerLockElement === document.body);

    document.addEventListener("mousemove", e => {
        if (!isLocked) return;
        camera.rotation.y -= e.movementX * 0.002;
        camera.rotation.x -= e.movementY * 0.002;
        camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
    });

    function placeWall() {
        raycaster.setFromCamera(center, camera);
        const hit = raycaster.intersectObject(floor);
        if (hit.length > 0) createObject({x: hit[0].point.x, y: 1.5, z: hit[0].point.z}, camera.rotation.y, {x:1, y:1, z:1});
    }

    // --- ANIMATION ---
    function animate() {
        requestAnimationFrame(animate);
        
        fallingObjects.forEach((obj) => {
            const gap = obj.mesh.position.y - obj.targetY;
            if (gap > 0.01) {
                obj.mesh.position.y -= gap * 0.08;
                obj.mesh.rotation.z += 0.01;
            } else {
                obj.mesh.position.y = obj.targetY;
                obj.mesh.rotation.z = 0;
            }
        });

        if (isLocked) {
            const speed = 0.15, dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
            if (keys.z) camera.position.addScaledVector(dir, speed);
            if (keys.s) camera.position.addScaledVector(dir, -speed);
            if (keys.q) camera.position.addScaledVector(side, speed);
            if (keys.d) camera.position.addScaledVector(side, -speed);
        }
        renderer.render(scene, camera);
    }

    animate();
    function clearScene() { localStorage.clear(); location.reload(); }
</script>

<a href="museum.html" style="
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: #ffffff;
    border: 1px solid #000000;
    color: #000000;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 6px;
    font-family: 'Segoe UI', sans-serif;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    z-index: 2000;
    transition: 0.2s;
" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='#ffffff'" onmousedown="event.stopPropagation()">
    →
</a>

</body>
</html>
