<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Galerie 3D - Superposition Ratio Conservé</title>
    <style>
        body { margin: 0; overflow: hidden; background: #eeeeee; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.95); border-radius: 12px;
            padding: 20px; font-size: 14px; z-index: 10;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15); width: 250px;
            display: none;
        }
        #hint {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7); color: white;
            padding: 10px 15px; border-radius: 8px; font-size: 13px; z-index: 5;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            border: 2px solid white; border-radius: 50%;
            pointer-events: none; mix-blend-mode: difference;
        }
        kbd { background: #eee; border-radius: 3px; padding: 2px 4px; border: 1px solid #ccc; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div id="hint">
    <kbd>M</kbd> Grand Cube | <kbd>E</kbd> Superposer Image (Ratio OK) | <kbd>0</kbd> Menu
</div>

<div id="ui">
    <strong> Commandes :</strong><br>
    <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> : Marcher<br><br>
    <kbd>M</kbd> :  <strong>Générer White Cube</strong><br>
    <kbd>E</kbd> :  <strong>Ajouter couche image</strong><br>
    <small>(Ratio conservé + opaque)</small><br><br>
    <kbd>X</kbd> : Supprimer l'élément visé<br>
    <kbd>0</kbd> : Menu complet<br>
    <hr>
    <button onclick="location.reload();" style="width:100%; padding:8px; cursor:pointer; color:red; border:1px solid #ccc; border-radius:5px;">🗑️ Tout effacer</button>
</div>

<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
    let isLocked = false;
    let artworks = [];
    let uiVisible = false;
    const keys = { z: false, q: false, s: false, d: false };

    const CUBE_SIZE = 10;
    const CUBE_HEIGHT = 5;
    const MOVE_SPEED = 0.2;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 15);
    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    scene.add(new THREE.GridHelper(500, 100, 0xbbbbbb));

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshBasicMaterial({ visible: false }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const raycaster = new THREE.Raycaster();
    const center = new THREE.Vector2(0, 0);

    function createWall(x, z, rotY) {
        const geometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_HEIGHT, 0.2);
        const material = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, CUBE_HEIGHT / 2, z);
        mesh.rotation.y = rotY;
        mesh.userData.imageCount = 0; 
        mesh.userData.isWall = true;
        scene.add(mesh);
        artworks.push(mesh);
    }

    function placeWhiteCube() {
        raycaster.setFromCamera(center, camera);
        const hit = raycaster.intersectObject(floor);
        if (hit.length > 0) {
            const p = hit[0].point;
            const offset = CUBE_SIZE / 2;
            createWall(p.x, p.z - offset, 0);
            createWall(p.x, p.z + offset, 0);
            createWall(p.x - offset, p.z, Math.PI / 2);
            createWall(p.x + offset, p.z, Math.PI / 2);
        }
    }

    function addImageLayer() {
        raycaster.setFromCamera(center, camera);
        const intersects = raycaster.intersectObjects(artworks);
        
        if (intersects.length > 0) {
            const hitObject = intersects[0].object;
            const parentWall = hitObject.userData.isWall ? hitObject : hitObject.userData.parentWall;
            
            const layerIndex = parentWall.userData.imageCount;
            const reductionFactor = Math.pow(0.8, layerIndex); 
            
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    new THREE.TextureLoader().load(ev.target.result, tex => {
                        tex.colorSpace = THREE.SRGBColorSpace;
                        
                        // --- CALCUL DU RATIO ---
                        const imgWidth = tex.image.width;
                        const imgHeight = tex.image.height;
                        const ratio = imgWidth / imgHeight;

                        // On définit une taille de base (ici basée sur la hauteur du mur)
                        let finalHeight = CUBE_HEIGHT * reductionFactor;
                        let finalWidth = finalHeight * ratio;

                        // Si l'image est trop large pour le mur après calcul du ratio, on réduit selon la largeur
                        if (finalWidth > CUBE_SIZE * reductionFactor) {
                            finalWidth = CUBE_SIZE * reductionFactor;
                            finalHeight = finalWidth / ratio;
                        }
                        
                        const geo = new THREE.PlaneGeometry(finalWidth, finalHeight);
                        
                        // TRANSPARENCE : Désactivée (opacity 1.0)
                        const mat = new THREE.MeshBasicMaterial({ 
                            map: tex, 
                            side: THREE.DoubleSide
                        });
                        
                        const plane = new THREE.Mesh(geo, mat);

                        plane.position.copy(parentWall.position);
                        plane.rotation.copy(parentWall.rotation);
                        
                        // Décalage pour éviter que les images se touchent
                        const zOffset = 0.11 + (layerIndex * 0.05);
                        plane.translateZ(zOffset);

                        plane.userData.parentWall = parentWall;
                        plane.userData.isWall = false;

                        scene.add(plane);
                        artworks.push(plane);
                        
                        parentWall.userData.imageCount++;
                    });
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }
    }

    // --- SYSTEME ---

    document.addEventListener("mousedown", () => { if (!isLocked) document.body.requestPointerLock(); });
    document.addEventListener("pointerlockchange", () => { isLocked = document.pointerLockElement === document.body; });

    document.addEventListener("keydown", e => {
        const key = e.key.toLowerCase();
        if (keys.hasOwnProperty(key)) keys[key] = true;
        if (key === "0") {
            uiVisible = !uiVisible;
            document.getElementById('ui').style.display = uiVisible ? 'block' : 'none';
        }
        if (!isLocked) return;
        if (key === "m") placeWhiteCube();
        if (key === "e") addImageLayer();
        if (key === "x") {
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(artworks);
            if(intersects.length > 0) {
                const obj = intersects[0].object;
                if(!obj.userData.isWall) { // Optionnel : ne supprime que les images, pas les murs
                    scene.remove(obj);
                    artworks = artworks.filter(w => w !== obj);
                }
            }
        }
    });

    document.addEventListener("keyup", e => { const key = e.key.toLowerCase(); if (keys.hasOwnProperty(key)) keys[key] = false; });

    document.addEventListener("mousemove", e => {
        if (!isLocked) return;
        camera.rotation.y -= e.movementX * 0.002;
        camera.rotation.x -= e.movementY * 0.002;
        camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
    });

    function animate() {
        requestAnimationFrame(animate);
        if (isLocked) {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
            if (keys.z) camera.position.addScaledVector(dir, MOVE_SPEED);
            if (keys.s) camera.position.addScaledVector(dir, -MOVE_SPEED);
            if (keys.q) camera.position.addScaledVector(side, MOVE_SPEED);
            if (keys.d) camera.position.addScaledVector(side, -MOVE_SPEED);
        }
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</html>
